<!doctype html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />

  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <meta name="theme-color" content="#0b0b0f" />
  <meta name="apple-mobile-web-app-title" content="QuickCalc" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="manifest" href="manifest.json" />

  <title>QuickCalc</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="app">

    <header class="topbar">
      <div>
        <p class="eyebrow">QUICKCALC</p>
        <h1>Snabbare. Enklare.</h1>
      </div>

      <button id="themeToggle"
              class="icon-btn"
              aria-label="Byt tema">
        ☀︎
      </button>
    </header>


    <section class="calculator card">

      <div class="display">
        <span id="expression"></span>

        <strong id="displayValue">
          0
        </strong>
      </div>


      <div class="operators">

        <button class="operator"
                data-op="+">
          +
        </button>

        <button class="operator"
                data-op="-">
          −
        </button>

        <button class="operator"
                data-op="*">
          ×
        </button>

        <button class="operator"
                data-op="/">
          ÷
        </button>

      </div>


      <button id="calculate"
              class="calculate">
        =
      </button>


      <div class="keypad">

        <button class="number"
                data-number="7">
          7
        </button>

        <button class="number"
                data-number="8">
          8
        </button>

        <button class="number"
                data-number="9">
          9
        </button>


        <button class="number"
                data-number="4">
          4
        </button>

        <button class="number"
                data-number="5">
          5
        </button>

        <button class="number"
                data-number="6">
          6
        </button>


        <button class="number"
                data-number="1">
          1
        </button>

        <button class="number"
                data-number="2">
          2
        </button>

        <button class="number"
                data-number="3">
          3
        </button>


        <button class="number zero"
                data-number="0">
          0
        </button>

        <button class="number"
                data-number=".">
          .
        </button>

        <button id="clear"
                class="clear">
          AC
        </button>

      </div>

    </section>


    <section class="history card">

      <div class="section-head">

        <h2>Historik</h2>

        <button id="clearHistory"
                class="text-btn">
          Rensa
        </button>

      </div>

      <div id="historyList"
           class="history-list">

        <p class="empty">
          Dina senaste beräkningar visas här.
        </p>

      </div>

    </section>

  </main>


  <script src="app.js"></script>

</body>
</html>
