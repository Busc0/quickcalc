<!doctype html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>QuickCalc</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">QUICKCALC</p>
        <h1>Snabbare. Enklare.</h1>
      </div>
      <button id="themeToggle" class="icon-btn" aria-label="Byt tema">☀︎</button>
    </header>

    <section class="calculator card">
      <label for="first">Första talet</label>
      <input id="first" type="number" inputmode="decimal" placeholder="0" />

      <div class="operators">
        <button class="operator active" data-op="+">+</button>
        <button class="operator" data-op="-">−</button>
        <button class="operator" data-op="*">×</button>
        <button class="operator" data-op="/">÷</button>
      </div>

      <label for="second">Andra talet</label>
      <input id="second" type="number" inputmode="decimal" placeholder="0" />

      <button id="calculate" class="calculate">Beräkna</button>

      <div id="result" class="result">
        <span>Resultat</span>
        <strong>—</strong>
      </div>
    </section>

    <section class="history card">
      <div class="section-head">
        <h2>Historik</h2>
        <button id="clearHistory" class="text-btn">Rensa</button>
      </div>
      <div id="historyList" class="history-list">
        <p class="empty">Dina senaste beräkningar visas här.</p>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
